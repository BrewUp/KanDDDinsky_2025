version: '3.8'

services:
  # MongoDB for read models
  mongodb:
    image: mongo:8.0
    container_name: brewup-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: brewup-purchase-readmodel
    volumes:
      - mongodb_data:/data/db
    networks:
      - brewup-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # EventStoreDB (Kurrent) for event sourcing
  eventstore:
    image: eventstore/eventstore:24.10.0-bookworm-slim
    container_name: brewup-eventstore
    ports:
      - "2113:2113"
      - "1113:1113"
    environment:
      EVENTSTORE_CLUSTER_SIZE: 1
      EVENTSTORE_RUN_PROJECTIONS: All
      EVENTSTORE_START_STANDARD_PROJECTIONS: "true"
      EVENTSTORE_HTTP_PORT: 2113
      EVENTSTORE_INSECURE: "true"
      EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP: "true"
      EVENTSTORE_ENABLE_EXTERNAL_TCP: "true"
      EVENTSTORE_EXT_TCP_PORT: 1113
    volumes:
      - eventstore_data:/var/lib/eventstore
      - eventstore_logs:/var/log/eventstore
    networks:
      - brewup-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2113/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # RabbitMQ for messaging
  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: brewup-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - brewup-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # BrewUp REST API
  brewup-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brewup-api
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080;http://+:8081
      ASPNETCORE_HTTP_PORTS: 8080
    depends_on:
      mongodb:
        condition: service_healthy
      eventstore:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - brewup-network
    volumes:
      - ./logs:/app/logs

networks:
  brewup-network:
    driver: bridge

volumes:
  mongodb_data:
  eventstore_data:
  eventstore_logs:
  rabbitmq_data:
